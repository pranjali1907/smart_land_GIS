<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Land GIS - Land Infrastructure & Parcel Portal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><polygon points='1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6'/></svg>" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet GIS Engine Stylesheet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Application Stylesheets -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <!-- Main Application Shell -->
    <div class="app-layout">
      <!-- Navigation Sidebar -->
      <aside class="sidebar" id="app-sidebar"></aside>

      <!-- Main Workspace -->
      <div class="main-wrapper">
        <!-- Topbar Header -->
        <header class="topbar" id="app-topbar"></header>

        <!-- Dynamic Content Views Host -->
        <main class="content-area" id="main-content-area">
          <!-- 1. Dashboard View -->
          <div class="view-container active" id="view-dashboard"></div>

          <!-- 2. Interactive Map View -->
          <div class="view-container" id="view-map"></div>

          <!-- 3. Land Registry Table View -->
          <div class="view-container" id="view-registry"></div>

          <!-- 4. Datasets & Master Plans View -->
          <div class="view-container" id="view-datasets"></div>

          <!-- 5. Audit Log & History View -->
          <div class="view-container" id="view-history"></div>

          <!-- 6. Trash & Recovery View -->
          <div class="view-container" id="view-trash"></div>

          <!-- 7. Role Management View -->
          <div class="view-container" id="view-users"></div>
        </main>
      </div>
    </div>

    <!-- Modals and Drawers Mount Points -->
    <div id="plot-detail-drawer-root"></div>
    <div id="add-plot-modal-root"></div>
    <div id="delete-modal-root"></div>
    <div id="toast-container" class="toast-container"></div>

    <!-- Leaflet GIS JavaScript Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Main ES Module Application Script -->
    <script type="module" src="js/app.js"></script>
  </body>
</html>
